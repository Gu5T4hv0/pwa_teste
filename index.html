<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha PWA Exemplo</title>
    
    <!-- Link para o Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Cor do tema para navegadores mobile -->
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <h1>Olá, eu sou uma PWA! 🚀</h1>
    <p>Abra este site e tente usá-lo ou instalá-lo.</p>

    <!-- Script para registrar o Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker registrado com sucesso! Escopo:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar o Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
